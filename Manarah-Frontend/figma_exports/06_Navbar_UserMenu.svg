<svg width="400" height="360" viewBox="0 0 400 360" fill="none" xmlns="http://www.w3.org/2000/svg">
  
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&amp;display=swap');
      * { font-family: 'Cairo', 'Segoe UI', Tahoma, sans-serif; }
      .bold { font-weight: 700; }
      .black { font-weight: 900; }
      .semibold { font-weight: 600; }
      .medium { font-weight: 500; }
      .regular { font-weight: 400; }
    </style>
    <filter id="card-shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="6" stdDeviation="14" flood-color="#0F1E36" flood-opacity="0.05"/>
    </filter>
    <filter id="amber-glow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#F59E0B" flood-opacity="0.32"/>
    </filter>
  </defs>

  <rect width="400" height="360" fill="#F8FAFC"/>

  <g filter="url(#card-shadow)" transform="translate(30, 20)">
    <rect x="0" y="0" width="340" height="310" rx="20" fill="#FFFFFF"/>

    <g transform="translate(20, 20)">
      <circle cx="25" cy="25" r="22" fill="#FEF3C7"/>
      <text x="25" y="31" fill="#B45309" font-size="14" class="bold" text-anchor="middle">ج.ص</text>
      <text x="60" y="24" fill="#0F1E36" font-size="14" class="black">جلال عبد الملك الصوفي</text>
      <text x="60" y="42" fill="#64748B" font-size="11" class="semibold">jalal.matluq@gmail.com</text>
      <circle cx="280" cy="20" r="8" fill="#10B981"/>
      <text x="280" y="23" fill="#FFFFFF" font-size="9" class="bold" text-anchor="middle">✓</text>
    </g>

    <line x1="20" y1="85" x2="320" y2="85" stroke="#F1F5F9"/>

    <g transform="translate(20, 100)">
      <rect x="0" y="0" width="300" height="40" rx="10" fill="#F8FAFC"/>
      <text x="280" y="25" fill="#0F1E36" font-size="13" class="bold" text-anchor="end">👤  عرض الملف المهني</text>

      <rect x="0" y="48" width="300" height="40" rx="10" fill="#FFFFFF"/>
      <text x="280" y="73" fill="#0F1E36" font-size="13" class="semibold" text-anchor="end">✏️  تعديل البيانات الأساسية</text>

      <rect x="0" y="96" width="300" height="40" rx="10" fill="#FFFFFF"/>
      <text x="280" y="121" fill="#0F1E36" font-size="13" class="semibold" text-anchor="end">⚙️  إعدادات الحساب والأمان</text>
    </g>

    <line x1="20" y1="245" x2="320" y2="245" stroke="#F1F5F9"/>

    <g transform="translate(20, 255)">
      <rect x="0" y="0" width="300" height="40" rx="10" fill="#FEF2F2"/>
      <text x="280" y="25" fill="#DC2626" font-size="13" class="bold" text-anchor="end">🚪  تسجيل الخروج</text>
    </g>
  </g>
</svg>